<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b5f" />
    <meta name="description" content="OPD Saathi: register in your language, get your OPD token, track your turn and find your way in City District Hospital." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>OPD Saathi</title>
  </head>
  <body>
    <noscript>Please turn on JavaScript to use OPD Saathi. For an emergency, go to the Emergency (Casualty) department on the ground floor, or call 112 / 108.</noscript>
    <div id="root">
      <!-- Shown instantly, before the app loads (weak connections). React replaces it. -->
      <div style="font-family:system-ui,'Noto Sans','Nirmala UI',sans-serif;max-width:36rem;margin:0 auto;padding:24px 16px;color:#111827;font-size:18px;line-height:1.5">
        <p style="font-size:24px;font-weight:700;margin:0 0 8px">OPD Saathi · ओपीडी साथी · OPD சாத்தி</p>
        <p style="margin:0 0 16px;color:#404c5c">City District Hospital · Loading… / लोड हो रहा है… / ஏற்றுகிறது…</p>
        <p style="background:#b41818;color:#fff;border-radius:16px;padding:16px;margin:0;font-weight:700">
          Emergency? Go to Casualty: ground floor, red doors. No token needed. Call 112 / 108.<br />
          इमरजेंसी? भूतल पर लाल दरवाज़ों वाले Casualty जाएँ। 112 / 108
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
